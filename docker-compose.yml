services:

  web:

    image: php:8.3-apache

    container_name: ddl_web

    ports:
      - "8080:80"

    volumes:
      - ./:/var/www/html

    depends_on:
      - mysql

  mysql:

    image: mysql:8.0

    container_name: ddl_mysql

    environment:

      MYSQL_ROOT_PASSWORD: root

      MYSQL_DATABASE: desdelalinea

    ports:
      - "3306:3306"

  phpmyadmin:

    image: phpmyadmin/phpmyadmin

    container_name: ddl_pma

    ports:
      - "8081:80"

    environment:

      PMA_HOST: mysql